<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Life Management App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>My Life Manager</h1>
            <button id="add-event-btn">+</button>
        </header>
        <div id="calendar">
            <div id="calendar-header"></div>
            <div id="calendar-body"></div>
        </div>
        <div id="task-manager">
            <h2>Tasks</h2>
            <div id="task-input">
                <input type="text" id="task-title" placeholder="Add a new task...">
                <button id="add-task-btn">Add</button>
            </div>
            <ul id="task-list"></ul>
        </div>
        <div id="productivity-dashboard">
            <h2>Dashboard</h2>
            <div id="today-progress"></div>
            <div id="completed-tasks"></div>
            <div id="focus-score"></div>
            <div id="current-activity"></div>
            <div id="upcoming-schedule"></div>
        </div>
        <div id="quotes-panel"></div>
    </div>
    <div id="event-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Add/Edit Event</h2>
            <input type="text" id="event-title" placeholder="Event Title" required>
            <input type="time" id="event-start" required>
            <input type="time" id="event-end" required>
            <input type="color" id="event-color" value="#6a0dad">
            <textarea id="event-notes" placeholder="Notes"></textarea>
            <button id="save-event-btn">Save Event</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
