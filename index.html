<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OS | Personal Life Management</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar glass-panel">
            <div class="brand">
                <i class="fas fa-layer-group neon-blue"></i>
                <h2>Nexus OS</h2>
            </div>
            
            <nav class="main-nav">
                <button class="nav-item active"><i class="fas fa-calendar-day"></i> Day</button>
                <button class="nav-item"><i class="fas fa-calendar-week"></i> Week</button>
                <button class="nav-item"><i class="fas fa-calendar-alt"></i> Month</button>
                <button class="nav-item"><i class="fas fa-chart-line"></i> Stats</button>
            </nav>

            <div class="categories-section">
                <h3>Life Categories</h3>
                <ul id="category-list" class="category-list">
                    <!-- Populated by JS -->
                </ul>
            </div>
            
            <div class="bottom-actions">
                <button class="settings-btn"><i class="fas fa-cog"></i> Settings</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header glass-panel">
                <div class="date-display">
                    <h1 id="current-date-title">Today</h1>
                    <p id="current-date-subtitle">...</p>
                </div>
                <div class="dashboard-stats">
                    <div class="stat-card">
                        <span class="stat-label">Focus Score</span>
                        <span class="stat-value neon-purple" id="focus-score">85%</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label">Tasks Done</span>
                        <span class="stat-value neon-blue" id="tasks-stat">0/0</span>
                    </div>
                </div>
            </header>

            <div class="calendar-container glass-panel">
                <div class="timeline-header">
                    <span class="tz-label">CST</span>
                    <div class="day-headers">
                        <div class="day-header active">Today</div>
                    </div>
                </div>
                <div class="timeline-body" id="timeline-body">
                    <div class="time-labels" id="time-labels"></div>
                    <div class="time-grid" id="time-grid">
                        <div class="current-time-indicator" id="time-indicator"></div>
                        <!-- Events injected here -->
                    </div>
                </div>
            </div>
        </main>

        <!-- Right Panel (Productivity) -->
        <aside class="right-panel">
            <!-- Pomodoro -->
            <div class="pomodoro-widget glass-panel">
                <div class="pomo-header">
                    <h3><i class="fas fa-stopwatch"></i> Focus Mode</h3>
                </div>
                <div class="pomo-display neon-blue" id="pomo-timer">25:00</div>
                <div class="pomo-controls">
                    <button id="pomo-start"><i class="fas fa-play"></i></button>
                    <button id="pomo-reset"><i class="fas fa-redo"></i></button>
                </div>
            </div>

            <!-- Tasks -->
            <div class="tasks-widget glass-panel">
                <div class="widget-header">
                    <h3><i class="fas fa-check-square"></i> Action Items</h3>
                    <button id="add-task-btn" class="icon-btn"><i class="fas fa-plus"></i></button>
                </div>
                <div class="task-input-container hidden" id="task-input-container">
                    <input type="text" id="new-task-input" placeholder="Type and press Enter...">
                </div>
                <ul class="task-list" id="task-list">
                    <!-- Tasks injected here -->
                </ul>
            </div>

            <!-- Habits -->
            <div class="habits-widget glass-panel">
                <div class="widget-header">
                    <h3><i class="fas fa-leaf"></i> Daily Habits</h3>
                </div>
                <ul class="habit-list" id="habit-list">
                    <!-- Habits injected here -->
                </ul>
            </div>
        </aside>

        <!-- Floating Action Button -->
        <button class="fab" id="main-fab"><i class="fas fa-plus"></i></button>

        <!-- Event Modal -->
        <div class="modal-overlay hidden" id="event-modal">
            <div class="modal glass-panel">
                <h2>New Time Block</h2>
                <form id="event-form">
                    <input type="text" id="event-title" placeholder="Event Title" required>
                    <div class="time-inputs">
                        <input type="time" id="event-start" required>
                        <span>to</span>
                        <input type="time" id="event-end" required>
                    </div>
                    <select id="event-category">
                        <option value="Health">Health</option>
                        <option value="Marriage">Marriage</option>
                        <option value="Spiritual">Spiritual</option>
                        <option value="Work">Work</option>
                        <option value="Business">Business</option>
                        <option value="Learning">Learning</option>
                        <option value="Family">Family</option>
                    </select>
                    <textarea id="event-notes" placeholder="Notes..."></textarea>
                    <div class="modal-actions">
                        <button type="button" id="cancel-event" class="btn-secondary">Cancel</button>
                        <button type="submit" class="btn-primary">Save Block</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
