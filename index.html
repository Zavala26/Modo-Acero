<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Productivity Calendar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>Calendar</h2>
      </div>

      <button id="addEventBtn" class="add-event-btn">+ Add Event</button>

      <div class="mini-info">
        <p id="todayLabel"></p>
      </div>
    </aside>

    <main class="calendar-container">
      <header class="calendar-header">
        <div class="nav-controls">
          <button id="prevBtn">◀</button>
          <button id="todayBtn">Today</button>
          <button id="nextBtn">▶</button>
        </div>

        <h1 id="currentViewTitle"></h1>

        <div class="view-switcher">
          <button class="view-btn active" data-view="day">Day</button>
          <button class="view-btn" data-view="week">Week</button>
          <button class="view-btn" data-view="month">Month</button>
        </div>
      </header>

      <section id="calendar"></section>
    </main>
  </div>

  <div class="modal hidden" id="eventModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Create Event</h3>
        <button id="closeModal">✕</button>
      </div>

      <form id="eventForm">
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="eventTitle" required />
        </div>

        <div class="form-group">
          <label>Date</label>
          <input type="date" id="eventDate" required />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Start Time</label>
            <input type="time" id="eventStart" required />
          </div>

          <div class="form-group">
            <label>End Time</label>
            <input type="time" id="eventEnd" required />
          </div>
        </div>

        <button type="submit" class="save-btn">Save Event</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
---
